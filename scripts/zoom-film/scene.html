<!doctype html>
<!--
  ScanView 줌 영상 (첫 화면용). renderAt(t) 가 시각 t 의 한 장면을 그리는 순수 함수라 ?t=초 로 멈춰 볼 수 있다.
  창고 → 라벨 → 폰 화면 시점 스캔(해독 + 연속) → 폰에서 바로 앞 PC 로 금색 빛, 두 번째 빛은 지붕 위로 →
  지구로 줌아웃, 태평양을 건너 LA 사무실 PC → 다시 지구를 건너 서울 창고. 장면 셋(창고·지구·LA 사무실)을 겹쳐 잇는다.
  render.cjs 가 프레임마다 window.renderFrame(i) 를 불러 JPEG 로 받고 ffmpeg 로 묶는다.
-->

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ───────── 형식 ─────────
// ?fmt=wide: 첫 화면 배경용 가로 영상 (16:9). 왼쪽은 문구 자리라 피사체를 오른쪽(가로 66%)에 둔다
const WIDE = new URLSearchParams(location.search).get('fmt') === 'wide';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1350;   // 결과 프레임 (16:9 · 4:5)
const SS = WIDE ? 1.25 : 1.5;                          // 슈퍼샘플 배율
const CX = WIDE ? 0.66 : 0.5;                          // 피사체 가로 위치 (화면 폭 비율)
const ZK = WIDE ? 1.6 : 1.3;                           // 카메라를 얼마나 물리는지 (전체적으로 덜 확대)
const FULL_W = 2 * CX * W;                             // 광학 중심을 CX 에 두는 가상 전체 폭
function frameCam(cam) { cam.aspect = FULL_W / H; if (WIDE) cam.setViewOffset(FULL_W, H, 0, 0, W, H); cam.updateProjectionMatrix(); return cam; }
const DURATION = 38;               // 끊김 없는 반복 길이 (초)
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ko'; // 머리글·폰 화면 언어
const FPS = 30;
const SUB = 4;                     // 프레임당 서브프레임 (180° 셔터)
const FOV = 32;

// ───────── 색 (사이트 그래파이트 + 강조색 하나) ─────────
const C = {
  paper: 0xf4f4f5, ink: 0x18181b, mid: 0x52525b, line: 0xe4e4e7,
  kraft: 0xcdbfa6, floor: 0xd6d6da, wall: 0xe9e9ec, steel: 0x8b8b93, honey: 0xf2b230,
};

// ───────── EAN-13 ─────────
const CODE = '8801234001014';
const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function ean13Modules(code) {
  const d = code.split('').map(Number);
  let s = '101';
  const par = PARITY[d[0]];
  for (let i = 1; i <= 6; i++) s += (par[i - 1] === 'L' ? L : G)[d[i]];
  s += '01010';
  for (let i = 7; i <= 12; i++) s += R[d[i]];
  s += '101';
  return s; // 95 modules
}
const MODULES = ean13Modules(CODE);
const GUARD = new Set([0,1,2,45,46,47,48,49,92,93,94]);

// ───────── 장면 ─────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W * SS, H * SS, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.wall);
scene.fog = new THREE.Fog(C.wall, 9, 26);
const camera = frameCam(new THREE.PerspectiveCamera(FOV, W / H, 0.0005, 80));

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfcfd4, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-3, 6, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.0004;
scene.add(sun);

const std = (color, rough = 0.85, metal = 0) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });

// 바닥·벽
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(C.floor, 0.95));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 8), std(C.wall, 1));
wall.position.set(0, 4, -1.2); scene.add(wall);
// 바닥 통로선
for (const x of [-1.6, 3.4]) {
  const ln = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 30), std(C.honey, 0.9));
  ln.rotation.x = -Math.PI / 2; ln.position.set(x, 0.001, 2); scene.add(ln);
}

// 선반 (3단) + 상자
const rack = new THREE.Group(); scene.add(rack);
const steel = std(C.steel, 0.5, 0.6);
for (const x of [-1.5, 1.5]) for (const z of [-0.45, 0.45]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.6, 0.06), steel);
  post.position.set(x, 1.3, z); post.castShadow = true; rack.add(post);
}
const levels = [0.18, 0.86, 1.54, 2.22];
for (const y of levels) {
  const deck = new THREE.Mesh(new THREE.BoxGeometry(3.06, 0.04, 0.96), std(0x9a9aa2, 0.6, 0.4));
  deck.position.set(0, y, 0); deck.receiveShadow = true; deck.castShadow = true; rack.add(deck);
}
// 상자 배치 (결정적 난수)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const boxes = [];
for (let li = 0; li < 3; li++) {
  let x = -1.38;
  while (x < 1.3) {
    const w = 0.34 + rnd() * 0.22, h = 0.3 + rnd() * 0.24, d = 0.4 + rnd() * 0.12;
    if (x + w > 1.42) break;
    boxes.push({ x: x + w / 2, y: levels[li] + 0.02 + h / 2, w, h, d, li });
    x += w + 0.04 + rnd() * 0.05;
  }
}
// 주인공 상자: 가운데 단 가운데에 가장 가까운 것
let hero = boxes.filter(b => b.li === 1).reduce((a, b) => Math.abs(b.x - 0.1) < Math.abs(a.x - 0.1) ? b : a);
hero.w = 0.46; hero.h = 0.38; hero.d = 0.44; hero.y = levels[1] + 0.02 + hero.h / 2;
// 연속 스캔으로 이어서 찍을 옆 상자 둘 (주인공 오른쪽, PC 쪽으로)
const row1 = boxes.filter((b) => b.li === 1 && b !== hero).sort((a, b) => a.x - b.x);
const SIDE_BOXES = [...row1.filter((b) => b.x > hero.x), ...row1.filter((b) => b.x < hero.x).reverse()].slice(0, 2);
const kraft = std(C.kraft, 0.95);
for (const b of boxes) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), kraft);
  m.position.set(b.x, b.y, 0.45 - b.d / 2 + 0.02); m.castShadow = true; m.receiveShadow = true; rack.add(m);
  b.front = m.position.z + b.d / 2;
  // 테이프 한 줄
  const tape = new THREE.Mesh(new THREE.BoxGeometry(b.w * 0.18, b.h + 0.002, b.d + 0.002), std(0xbfb196, 0.6));
  tape.position.copy(m.position); rack.add(tape);
  // 다른 상자의 작은 라벨 (흰 직사각형)
  if (b !== hero && !SIDE_BOXES.includes(b)) {
    const lb = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.06), std(0xfafafa, 0.9));
    lb.position.set(b.x + b.w * 0.18, b.y + b.h * 0.12, b.front + 0.001); rack.add(lb);
  }
}

// ───────── 주인공 라벨 (종이 질감은 셰이더로: 확대할수록 섬유가 보임) ─────────
const LABEL_W = 0.1, LABEL_H = 0.064;
// 상자 가운데 테이프(폭 약 8 cm)를 피해 오른쪽에 붙인다
const labelCenter = new THREE.Vector3(hero.x + 0.105, hero.y + 0.04, hero.front + 0.0016);
const paperVert = `
  varying vec3 vW; varying vec3 vN; varying vec2 vUv;
  void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix)*normal);
  gl_Position = projectionMatrix * viewMatrix * w; }`;
const noiseGLSL = `
  float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=.5; } return s; }
  // 섬유: 한 방향으로 늘린 노이즈
  float fibers(vec2 p){ return fbm(vec2(p.x*0.35, p.y*3.0)) * .6 + fbm(vec2(p.y*0.4+3.1, p.x*2.6)) * .4; }`;
function paperMaterial(base, inkMix = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { uBase: { value: new THREE.Color(base) }, uLight: { value: sun.position.clone().normalize() }, uInk: { value: inkMix } },
    vertexShader: paperVert,
    fragmentShader: `
      uniform vec3 uBase; uniform vec3 uLight; uniform float uInk;
      varying vec3 vW; varying vec3 vN; varying vec2 vUv;
      ${noiseGLSL}
      void main(){
        vec2 p = vW.xy;
        float f1 = fibers(p*9000.);   // 0.1 mm 섬유
        float f2 = fbm(p*1400.);      // 얼룩
        float f3 = fibers(p*60000.);  // 0.02 mm
        vec3 c = uBase;
        if (uInk < .5) { c *= 1. - .07*f1 - .04*f2 - .05*f3; }
        else { c = mix(c, c + vec3(.07), f1*.6 + f3*.5); }   // 잉크도 종이결을 따라 얼룩
        float diff = max(dot(normalize(vN), uLight), 0.) * .55 + .6;
        gl_FragColor = vec4(c*diff, 1.);
        #include <colorspace_fragment>
      }`,
  });
}
const labelGroup = new THREE.Group(); labelGroup.position.copy(labelCenter); rack.add(labelGroup);
const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(LABEL_W, LABEL_H), paperMaterial(0xfbfbfb));
labelGroup.add(labelMesh);

// 라벨 위 글자 (위치 코드·수량) — 캔버스 텍스처
function textCanvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t; }
const headTex = textCanvas(2048, 400, (g, w, h) => {
  g.fillStyle = '#18181b'; g.font = '800 200px "Noto Sans KR"'; g.textBaseline = 'middle'; g.fillText('A-0312', 40, h / 2);
  g.font = '700 120px "JetBrains Mono"'; g.textAlign = 'right'; g.fillText('24 EA', w - 40, h / 2);
});
const head = new THREE.Mesh(new THREE.PlaneGeometry(LABEL_W * 0.8, LABEL_W * 0.8 * 400 / 2048), new THREE.MeshBasicMaterial({ map: headTex, transparent: true, toneMapped: false }));
head.position.set(0, LABEL_H * 0.355, 0.00005); labelGroup.add(head);

// 옆 라벨 둘: QR 과 Code 128 (연속 스캔에서 차례로 읽힌다)
const SIDE = [
  { kind: 'QR', code: 'LOT-2611-B0418', head: 'B-0418', qty: '12 EA' },
  { kind: 'CODE 128', code: 'BOX-C0527-03', head: 'C-0527', qty: '6 EA' },
];
function drawSideLabel(g, w, h, d) {
  g.fillStyle = '#fbfbfb'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#18181b'; g.textBaseline = 'middle';
  g.font = '800 120px "Noto Sans KR"'; g.textAlign = 'left'; g.fillText(d.head, 70, 120);
  g.font = '700 72px "JetBrains Mono"'; g.textAlign = 'right'; g.fillText(d.qty, w - 70, 120);
  let sd = 11; const r = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  if (d.kind === 'QR') {
    const n = 25, cell = 15, x0 = w / 2 - n * cell / 2, y0 = 228;
    const finder = (i, j) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([a, b]) => i >= a && i < a + 7 && j >= b && j < b + 7);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      let on;
      if (finder(i, j)) { const [a, b] = [[0, 0], [n - 7, 0], [0, n - 7]].find(([a, b]) => i >= a && i < a + 7 && j >= b && j < b + 7); const u = i - a, v = j - b; on = u === 0 || u === 6 || v === 0 || v === 6 || (u >= 2 && u <= 4 && v >= 2 && v <= 4); }
      else on = r() < 0.48;
      if (on) g.fillRect(x0 + i * cell, y0 + j * cell, cell, cell);
    }
  } else {
    const x0 = 260, x1 = w - 260; let x = x0, on = true;
    while (x < x1) { const bw = (1 + Math.floor(r() * 4)) * 3.2; if (on) g.fillRect(x, 270, bw, 210); x += bw; on = !on; }
    g.font = '500 52px "JetBrains Mono"'; g.textAlign = 'center'; g.fillText(d.code, w / 2, 560);
  }
}
SIDE.forEach((d, k) => {
  const b = SIDE_BOXES[k];
  const tex = textCanvas(1000, 640, (g, w, h) => drawSideLabel(g, w, h, d));
  d.tex = tex;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.064), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
  m.position.set(b.x + 0.105, b.y + 0.04, b.front + 0.0016); rack.add(m);
  d.codeWorld = m.position.clone().add(new THREE.Vector3(0, -0.0095, 0)); // 코드 그림(QR·막대+글자)의 가운데
});

// 바코드 막대: 실제 기하 (모듈 0.33 mm, 막대 높이 22.85 mm 의 80%)
const MOD = 0.00033;
const BAR_H = 0.0229 * 0.8, GUARD_EXT = 0.0016;
const barcodeCenter = new THREE.Vector3(0, -0.004, 0.00006);
const barsGroup = new THREE.Group(); barsGroup.position.copy(barcodeCenter); labelGroup.add(barsGroup);
const inkMat = paperMaterial(0x141416, 1);
{
  let i = 0;
  while (i < 95) {
    if (MODULES[i] === '1') {
      let j = i; while (j < 95 && MODULES[j] === '1') j++;
      const guard = GUARD.has(i);
      const hh = BAR_H + (guard ? GUARD_EXT : 0);
      const bar = new THREE.Mesh(new THREE.PlaneGeometry((j - i) * MOD, hh), inkMat);
      bar.position.set((i + (j - i) / 2 - 47.5) * MOD, (BAR_H - hh) / 2, 0);
      barsGroup.add(bar);
      i = j;
    } else i++;
  }
}
// 바코드 아래 숫자 (스캔 후 한 자리씩 강조색)
const digitsCanvas = document.createElement('canvas'); digitsCanvas.width = 2400; digitsCanvas.height = 240;
const digitsTex = new THREE.CanvasTexture(digitsCanvas); digitsTex.colorSpace = THREE.SRGBColorSpace; digitsTex.anisotropy = 16;
const DIG_W = 95 * MOD * 1.08;
const digits = new THREE.Mesh(new THREE.PlaneGeometry(DIG_W, DIG_W * 240 / 2400), new THREE.MeshBasicMaterial({ map: digitsTex, transparent: true, toneMapped: false }));
digits.position.set(barcodeCenter.x - 0.0004, barcodeCenter.y - BAR_H / 2 - 0.0021, 0.00006); labelGroup.add(digits);
function drawDigits(lit) { // lit: 0..13 켜진 자리 수 (소수 = 켜지는 중)
  const g = digitsCanvas.getContext('2d'); g.clearRect(0, 0, 2400, 240);
  g.font = '500 190px "JetBrains Mono"'; g.textBaseline = 'middle'; g.textAlign = 'center';
  for (let k = 0; k < 13; k++) {
    const x = k === 0 ? 70 : (k <= 6 ? 220 + (k - 1) * 165 : 1290 + (k - 7) * 165);
    const a = Math.min(1, Math.max(0, lit - k));
    g.fillStyle = a > 0 ? `rgba(242,178,48,${0.35 + 0.65 * a})` : '#18181b';
    g.fillText(CODE[k], x, 125);
    if (a > 0) { g.fillStyle = `rgba(24,24,27,${1 - a})`; g.fillText(CODE[k], x, 125); }
  }
  digitsTex.needsUpdate = true;
}

// 스캔 빛: 막대 위를 지나가는 얇은 선 (강조색, 블룸)
const beamMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(C.honey).multiplyScalar(6), transparent: true, opacity: 0, toneMapped: false, depthWrite: false, blending: THREE.AdditiveBlending });
const beam = new THREE.Mesh(new THREE.PlaneGeometry(0.00012, BAR_H * 1.25), beamMat);
beam.position.set(0, 0, 0.0001); barsGroup.add(beam);
const glowMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(C.honey).multiplyScalar(1.6), transparent: true, opacity: 0, toneMapped: false, depthWrite: false, blending: THREE.AdditiveBlending });
const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.0012, BAR_H * 1.3), glowMat);
glow.position.set(0, 0, 0.00009); barsGroup.add(glow);

// ───────── 책상과 모니터 (끝 장면을 첫 장면에 심어 둔다) ─────────
const desk = new THREE.Group(); scene.add(desk);
desk.position.set(1.3, 0, 2.35); desk.rotation.y = -0.38;
const top = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.04, 0.7), std(0xdedee2, 0.7));
top.position.set(0, 0.74, 0); top.castShadow = true; top.receiveShadow = true; desk.add(top);
for (const [x, z] of [[-0.6, -0.3], [0.6, -0.3], [-0.6, 0.3], [0.6, 0.3]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.74, 0.04), steel); leg.position.set(x, 0.37, z); desk.add(leg);
}
const SCREEN_W = 0.6, SCREEN_H = 0.375;
const mon = new THREE.Mesh(new THREE.BoxGeometry(SCREEN_W + 0.03, SCREEN_H + 0.03, 0.025), std(C.ink, 0.4, 0.2));
mon.position.set(0, 1.08, -0.15); mon.castShadow = true; desk.add(mon);
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.04), std(C.ink, 0.4)); stand.position.set(0, 0.9, -0.18); desk.add(stand);
const screenCanvas = document.createElement('canvas'); screenCanvas.width = 1600; screenCanvas.height = 1000;
const screenTex = new THREE.CanvasTexture(screenCanvas); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 16;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, SCREEN_H), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
screen.position.set(0, 1.08, -0.137); desk.add(screen);
const screenCenter = new THREE.Vector3(); screen.getWorldPosition(screenCenter);
const screenNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(desk.quaternion).normalize();

const PREV = ['8801234003032', 'BOX-A0312-07', '8801234002028', '8801234001014', '8801234006064'];
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
// 세션 화면 (사이트 세션 페이지를 단순화). rowIn: 0..1 새 줄이 들어오는 정도, hl: 강조 정도, after: 새 줄 포함 여부
function drawScreen(rowIn, hl, count, { canvas = screenCanvas, tex = screenTex, hhmm = '09:41' } = {}) {
  const g = canvas.getContext('2d'), w = 1600, h = 1000;
  g.fillStyle = '#f4f4f5'; g.fillRect(0, 0, w, h);
  // 창 틀
  g.fillStyle = '#ffffff'; rr(g, 40, 40, w - 80, h - 80, 36); g.fill();
  g.fillStyle = '#e4e4e7'; g.fillRect(40, 110, w - 80, 2);
  for (let k = 0; k < 3; k++) { g.fillStyle = '#e4e4e7'; g.beginPath(); g.arc(90 + k * 34, 76, 11, 0, 7); g.fill(); }
  g.fillStyle = '#71717a'; g.font = '500 30px "JetBrains Mono"'; g.fillText('scanview.app/session/A3F9K2', 210, 87);
  g.fillStyle = '#18181b'; g.font = '800 46px "Noto Sans KR"'; g.fillText('A-0312', 90, 190);
  // 마지막 스캔 카드
  g.fillStyle = '#eaeaec'; rr(g, 90, 230, w - 180, 210, 26); g.fill();
  const NEW = [SCANS[2].code, SCANS[1].code, SCANS[0].code];
  const latest = rowIn > 0.5 ? NEW[0] : PREV[0];
  g.fillStyle = '#52525b'; g.font = '700 28px "Noto Sans KR"'; g.fillText('●', 120, 285);
  g.fillStyle = '#18181b'; g.font = '700 92px "JetBrains Mono"'; g.fillText(latest, 120, 390);
  g.fillStyle = '#71717a'; g.font = '500 30px "JetBrains Mono"'; g.fillText(`${count}`, w - 230, 285);
  // 표
  const rows = rowIn > 0 ? [...NEW, ...PREV] : PREV;
  const y0 = 480, rh = 86;
  g.fillStyle = '#fafafa'; rr(g, 90, y0, w - 180, 60, 14); g.fill();
  g.fillStyle = '#71717a'; g.font = '700 26px "Noto Sans KR"'; g.fillText('#', 120, y0 + 40); g.fillText('CODE', 230, y0 + 40); g.fillText('TIME', w - 330, y0 + 40);
  g.save(); g.beginPath(); g.rect(90, y0 + 60, w - 180, h - y0 - 120); g.clip();
  const shift = rowIn > 0 ? (1 - easeOut(rowIn)) * -rh * 3 : 0;
  rows.forEach((code, k) => {
    const y = y0 + 60 + k * rh + shift;
    if (k < 3 && rowIn > 0) { g.fillStyle = `rgba(242,178,48,${0.28 * hl})`; g.fillRect(90, y, w - 180, rh); }
    g.fillStyle = '#e4e4e7'; g.fillRect(90, y + rh - 2, w - 180, 2);
    g.fillStyle = '#71717a'; g.font = '500 30px "JetBrains Mono"'; g.fillText(String(count - k), 120, y + 54);
    g.fillStyle = '#18181b'; g.font = '700 36px "JetBrains Mono"'; g.fillText(code, 230, y + 56);
    g.fillStyle = '#71717a'; g.font = '500 30px "JetBrains Mono"'; g.fillText(`${hhmm}:${String(14 - k * 3).padStart(2, '0')}`, w - 330, y + 54);
  });
  g.restore();
  tex.needsUpdate = true;
}

    const F = lang === 'ko' ? '700 28px "Noto Sans KR"' : '700 28px "JetBrains Mono"';
    g.globalAlpha = ca; g.font = F; g.textAlign = 'left';
    const tw = g.measureText(P.clock).width;
    const bx = WIDE ? CX * W - (tw + 48) / 2 : 56;
    g.fillStyle = 'rgba(24,24,27,.82)'; rr(g, bx, H - 150, tw + 48, 60, 30); g.fill();
    g.fillStyle = '#f2b230'; g.beginPath(); g.arc(bx + 24, H - 120, 7, 0, 7); g.fill();
    g.fillStyle = '#fafafa'; g.font = F; g.fillText(P.clock, bx + 40, H - 119);
  }
  g.restore();
}

// 폰 화면 시점: 화면 전체에 앱 스캔 UI, 첫 라벨에서는 막대 묶음이 빛나며 숫자가 결과로 날아간다
const PW = WIDE ? Math.round(H * 0.8) : W, OX = Math.round(CX * W - PW / 2); // 화면 시점 UI 영역 (4:5)
const povCanvas = document.createElement('canvas'); povCanvas.width = PW; povCanvas.height = H;
const toScreen = (local) => { const p = labelGroup.localToWorld(local.clone()).project(camera); return [(p.x + 1) / 2 * W - OX, (1 - p.y) / 2 * H]; };
function digitSpan(k) { // 자리 k(1~12)의 모듈 범위, 0번 자리는 왼쪽 가드 바깥
  if (k === 0) return [-8, -1];
  const s0 = k <= 6 ? 3 + 7 * (k - 1) : 50 + 7 * (k - 7);
  return [s0, s0 + 7];
}
function drawPOV(g, t) {
  const A = t < XF0 ? Math.min(1, Math.max(0, (t - 5.2) / 0.4)) : t < XF1 ? povW : 0;
  if (A <= 0) return;
  const pg = povCanvas.getContext('2d'); pg.clearRect(0, 0, PW, H);
  const slot = drawScanUI(pg, PW, H, t, { pov: true, flying: true });
  // 해독: DEC0 부터 자리마다 막대 묶음이 금색으로 빛나고, 그 자리에서 숫자가 떠올라 결과 칸으로 날아간다
  if (t >= DEC0 - 0.1 && t < SCANS[0].at + 0.05) {
    const bx = barcodeCenter.x, by = barcodeCenter.y;
    pg.save(); pg.textAlign = 'center'; pg.textBaseline = 'middle';
    for (let k = 0; k < 13; k++) {
      const tk = DEC0 + k * DEC_STEP, u = (t - tk) / DEC_FLY;
      const [m0, m1] = digitSpan(k);
      const [x0, yTop] = toScreen(V3(bx + (m0 - 47.5) * MOD, by + BAR_H / 2, 0));
      const [x1, yBot] = toScreen(V3(bx + (m1 - 47.5) * MOD, by - BAR_H / 2, 0));
      // 막대 묶음 빛
      const gl = u < 0 ? 0 : Math.max(0, 1 - u * 1.2);
      if (gl > 0) { pg.fillStyle = `rgba(242,178,48,${0.45 * gl})`; pg.fillRect(Math.min(x0, x1), yTop, Math.abs(x1 - x0), yBot - yTop); }
      // 숫자: 묶음 가운데 → 결과 칸 k 번째 자리 (살짝 위로 휘어 날아간다)
      if (u <= 0) continue;
      const e = ease(Math.min(1, u));
      const sx = (x0 + x1) / 2, sy = yTop - 20, tx = slot.x + (k + 0.5) * slot.cw, ty = slot.y + 1;
      const x = sx + (tx - sx) * e, y = sy + (ty - sy) * e - Math.sin(e * Math.PI) * 90;
      const fs = 40 + (slot.fs - 40) * e;
      pg.font = `700 ${fs}px "JetBrains Mono"`;
      pg.shadowColor = 'rgba(242,178,48,.9)'; pg.shadowBlur = 18 * (1 - e);
      pg.fillStyle = e < 1 ? '#f2b230' : '#18181b';
      pg.fillText(CODE[k], x, y);
      pg.shadowBlur = 0;
    }
    pg.restore();
  }
  g.save(); g.globalAlpha = A; g.drawImage(povCanvas, OX, 0); g.restore();
}

// 렌더러용: 프레임 i → JPEG (언어는 ?lang=)
window.renderFrame = (i) => {
  const t = i / FPS;
  frameAt(t);
  compose(t, LANG, 0);
  return out.toDataURL('image/jpeg', 0.94);
};
window.FRAMES = DURATION * FPS;

await document.fonts.load('800 52px "Noto Sans KR"'); await document.fonts.load('500 28px "Noto Sans KR"');
await document.fonts.load('700 40px "JetBrains Mono"'); await document.fonts.load('500 20px "JetBrains Mono"');
// ?style=anatomy: Anatomy 그림처럼 — 종이색 면, 4단 음영(툰), 모서리 윤곽선, 금색만 강조색
if (new URLSearchParams(location.search).get('style') === 'anatomy') {
  const g4 = new THREE.DataTexture(new Uint8Array([150, 182, 214, 250]), 4, 1, THREE.RedFormat);
  g4.minFilter = g4.magFilter = THREE.NearestFilter; g4.needsUpdate = true;
  const WHITE = new THREE.Color(0xffffff), INK = new THREE.LineBasicMaterial({ color: 0x3a3a40, transparent: true, opacity: 0.85 });
  const toon = new Map();
  const toPaper = (c) => { const hsl = {}; c.getHSL(hsl); const l = 0.8 + hsl.l * 0.18; return new THREE.Color().setHSL(hsl.h, hsl.s * 0.18, Math.min(0.97, l)); };
  for (const sc of [scene, sceneO]) {
    sc.traverse((o) => {
      if (!o.isMesh || !o.material || !o.material.isMeshStandardMaterial || o.material.map || o.material.transparent) return;
      const key = o.material.uuid;
      if (!toon.has(key)) toon.set(key, new THREE.MeshToonMaterial({ color: toPaper(o.material.color), gradientMap: g4, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
      o.material = toon.get(key);
      o.castShadow = o.receiveShadow = false;
      if (o.geometry && o.geometry.attributes.position.count < 20000) o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28), INK));
    });
  }
  renderer.shadowMap.enabled = false;
  sceneO.traverse((o) => { if (o.isLight) o.color.set(0xffffff); });
  // LA 창밖: 색 대신 먹 농담으로 (강조색은 금색 하나)
  { const c = winTex.image, g = c.getContext('2d'), cp = document.createElement('canvas'); cp.width = c.width; cp.height = c.height;
    const h = cp.getContext('2d'); h.filter = 'grayscale(1) contrast(0.8) brightness(1.12)'; h.drawImage(c, 0, 0); g.clearRect(0, 0, c.width, c.height); g.drawImage(cp, 0, 0); winTex.needsUpdate = true; }
  renderer.toneMapping = THREE.NoToneMapping;
  scene.background = new THREE.Color(0xf4f4f2); scene.fog.color = new THREE.Color(0xf4f4f2);
}
await document.fonts.ready;
headTex.image.getContext('2d'); // 글꼴 로드 후 라벨 글자 다시 그림
{ const g = headTex.image.getContext('2d'); g.clearRect(0, 0, 2048, 400); g.textAlign = 'left'; g.fillStyle = '#18181b'; g.font = '800 200px "Noto Sans KR"'; g.textBaseline = 'middle'; g.fillText('A-0312', 40, 200); g.font = '700 120px "JetBrains Mono"'; g.textAlign = 'right'; g.fillText('24 EA', 2008, 200); headTex.needsUpdate = true; }

for (const d of SIDE) { drawSideLabel(d.tex.image.getContext('2d'), 1000, 640, d); d.tex.needsUpdate = true; }
const q = new URLSearchParams(location.search);
if (q.has('t')) { const t = Number(q.get('t')); frameAt(t, Number(q.get('sub') || SUB)); compose(t, LANG, 0); }
window.READY = true;
